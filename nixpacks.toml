[phases.setup]
nixPkgs = ["nodejs_18", "npm-9_x"]

[phases.install]
cmds = ["npm ci --prefer-offline --no-audit"]

[phases.build]
cmds = [
  "npm run build",
  "npx esbuild server/production.cjs --bundle --platform=node --format=cjs --outfile=dist/server.cjs --external:@neondatabase/serverless --external:drizzle-orm --external:pg --external:pg-pool --external:express --external:compression --external:express-rate-limit --external:express-session --external:connect-pg-simple"
]

[phases.start]
cmd = "node dist/server.cjs"

[variables]
NODE_ENV = "production"
NPM_CONFIG_CACHE = "/tmp/.npm"